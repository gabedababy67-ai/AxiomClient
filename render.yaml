services:
  - type: web
    name: axiom-client-web
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: axiom-client-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_DISCORD_URL
        sync: false
      - key: PUBLIC_CLIENT_VERSION
        value: 1.0.0
      - key: DOWNLOAD_FILENAME
        value: Axiom-Client.jar

databases:
  - name: axiom-client-db
